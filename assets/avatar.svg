<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#1d4ed8" />
    </linearGradient>
    <linearGradient id="skinGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffdfc4" />
      <stop offset="100%" stop-color="#f0c29f" />
    </linearGradient>
    <linearGradient id="hairGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#334155" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="shirtGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#475569" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
  </defs>

  <!-- Background Circle -->
  <circle cx="120" cy="120" r="116" fill="url(#bgGrad)" stroke="#60a5fa" stroke-width="4" />

  <!-- Code brackets subtle accent in background -->
  <path d="M 45 105 L 30 120 L 45 135" fill="none" stroke="rgba(255,255,255,0.25)" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" />
  <path d="M 195 105 L 210 120 L 195 135" fill="none" stroke="rgba(255,255,255,0.25)" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" />

  <!-- Shoulders & Hoodie / Shirt -->
  <path d="M 40 230 C 42 185, 75 168, 120 168 C 165 168, 198 185, 200 230 Z" fill="url(#shirtGrad)" />
  <!-- Shirt collar -->
  <path d="M 100 168 L 120 190 L 140 168 Z" fill="url(#skinGrad)" />

  <!-- Neck -->
  <rect x="106" y="145" width="28" height="26" rx="6" fill="url(#skinGrad)" />

  <!-- Head -->
  <ellipse cx="120" cy="118" rx="42" ry="46" fill="url(#skinGrad)" />

  <!-- Hair - Back / Base -->
  <path d="M 74 115 C 72 70, 95 62, 120 62 C 145 62, 168 70, 166 115 C 166 125, 160 115, 155 110 C 140 98, 100 98, 85 110 C 80 115, 74 125, 74 115 Z" fill="url(#hairGrad)" />

  <!-- Modern Hair Top Styling -->
  <path d="M 76 100 C 80 68, 105 58, 125 58 C 148 58, 165 68, 164 92 C 152 78, 132 75, 115 80 C 100 85, 88 88, 76 100 Z" fill="url(#hairGrad)" />

  <!-- Eyebrows -->
  <path d="M 94 105 Q 102 101 110 105" stroke="#1e293b" stroke-width="2.5" stroke-linecap="round" fill="none" />
  <path d="M 130 105 Q 138 101 146 105" stroke="#1e293b" stroke-width="2.5" stroke-linecap="round" fill="none" />

  <!-- Glasses -->
  <rect x="88" y="110" width="26" height="18" rx="6" fill="rgba(255,255,255,0.2)" stroke="#0f172a" stroke-width="3" />
  <rect x="126" y="110" width="26" height="18" rx="6" fill="rgba(255,255,255,0.2)" stroke="#0f172a" stroke-width="3" />
  <line x1="114" y1="118" x2="126" y2="118" stroke="#0f172a" stroke-width="3" />
  <line x1="76" y1="116" x2="88" y2="116" stroke="#0f172a" stroke-width="2.5" />
  <line x1="152" y1="116" x2="164" y2="116" stroke="#0f172a" stroke-width="2.5" />

  <!-- Eyes behind glasses -->
  <circle cx="101" cy="119" r="3" fill="#0f172a" />
  <circle cx="139" cy="119" r="3" fill="#0f172a" />

  <!-- Nose -->
  <path d="M 119 123 Q 120 131 123 131" stroke="#d99b79" stroke-width="2" stroke-linecap="round" fill="none" />

  <!-- Friendly Smile -->
  <path d="M 110 141 Q 120 148 130 141" stroke="#0f172a" stroke-width="2.5" stroke-linecap="round" fill="none" />
</svg>
